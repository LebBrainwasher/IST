<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HORUS - Surveillance Tactique Mobile GPS</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary: #4caf50;
            --text: #e0e0e0;
            --danger: #f44336;
            --info: #2196f3; 
            --warn: #ff9800;
            --purple: #B027F5;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 8px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh; 
            box-sizing: border-box;
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 5px;
            border-bottom: 1px solid var(--primary);
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        h1 { font-size: 0.85rem; margin: 0; color: var(--primary); text-transform: uppercase; }

        .input-zone {
            background: var(--card-bg);
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            flex-shrink: 0;
        }

        .type-switcher {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
        }

        .type-btn {
            flex: 1;
            padding: 10px 0;
            border: 1px solid #444;
            background: #333;
            color: #aaa;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            text-align: center;
        }

        .type-btn.active { color: white; }
        .type-btn[data-type="START"].active { background: var(--primary); border-color: var(--primary); }
        .type-btn[data-type="STOP"].active { background: var(--danger); border-color: var(--danger); }
        .type-btn[data-type="Observation"].active { background: var(--info); border-color: var(--info); }
        .type-btn[data-type="Contact"].active { background: var(--warn); border-color: var(--warn); }
        .type-btn[data-type="Chgt Direction"].active { background: var(--purple); border-color: var(--purple); }

        .desc-row { display: flex; gap: 6px; }

        input[type="text"], textarea {
            flex-grow: 1;
            padding: 12px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: white;
            border-radius: 6px;
            font-size: 1rem;
            width: 100%;
            box-sizing: border-box;
        }

        .btn-send {
            background: var(--primary);
            border: none;
            color: white;
            padding: 0 15px;
            border-radius: 6px;
            font-weight: bold;
        }

        .log-container {
            flex-grow: 1;
            overflow-y: auto;
            background: #161616;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        table { width: 100%; border-collapse: collapse; }
        th { font-size: 0.65rem; color: #666; text-transform: uppercase; padding: 6px; text-align: left; border-bottom: 1px solid #333; position: sticky; top: 0; background: #161616; z-index: 1; }
        td { padding: 10px 6px; border-bottom: 1px solid #222; vertical-align: middle; font-size: 0.85rem; }

        .col-time { width: 50px; font-family: monospace; color: #888; font-size: 0.75rem; }
        .col-type { width: 65px; font-weight: bold; font-size: 0.7rem; }
        .col-contact { width: 25px; text-align: center; }

        .t-start { color: var(--primary); }
        .t-stop { color: var(--danger); }
        .t-obs { color: var(--info); } 
        .t-contact { color: var(--warn); }
        .t-dir { color: #ffffff; }

        .plate-tag {
            font-weight: bold;
            background: #eee;
            color: #000;
            padding: 2px 5px;
            border-radius: 3px;
            font-family: 'Courier New', Courier, monospace;
            border-left: 4px solid #003399;
            font-size: 0.9rem;
            display: inline-block;
            letter-spacing: 0.5px;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .action-bar {
            display: flex;
            gap: 6px;
            padding: 4px 0;
            flex-shrink: 0;
        }

        .btn-action {
            flex: 1;
            padding: 10px 8px;
            border-radius: 6px;
            border: none;
            color: white;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
        }

        .b-save { background: #673ab7; }
        .b-load { background: #009688; }
        .b-pdf { background: #2196f3; }
        .b-clear { background: #555; }

        /* Modals */
        .modal {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.9); display: none;
            justify-content: center; align-items: center; z-index: 100;
        }
        .modal-content {
            background: #2d2d2d; padding: 15px; border-radius: 10px; width: 90%;
            text-align: center; border: 1px solid #444;
        }
        .modal-buttons { display: flex; gap: 8px; margin-top: 15px; }
        .btn-modal {
            flex: 1; padding: 12px; border-radius: 6px; border: none; font-weight: bold; color: white; font-size: 0.9rem;
        }



        .operator-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 6px;
            align-items: end;
            margin-bottom: 8px;
        }
        .operator-field label {
            display: block;
            margin: 0 0 4px 2px;
            color: #9ca3af;
            font-size: 0.62rem;
            font-weight: 800;
            letter-spacing: .06em;
            text-transform: uppercase;
        }
        .operator-field input { padding: 9px 10px; font-size: .85rem; }
        .gps-btn {
            min-height: 38px;
            padding: 0 11px;
            border: 1px solid #455a64;
            border-radius: 6px;
            background: #263238;
            color: #e5e7eb;
            font-size: .72rem;
            font-weight: 800;
            white-space: nowrap;
        }
        .gps-btn.loading { background: #37474f; color: #ffcc80; }
        .gps-btn.ready { background: #14532d; border-color: #22c55e; color: #dcfce7; }
        .gps-status {
            min-height: 18px;
            margin: -2px 0 7px 1px;
            color: #9ca3af;
            font-size: .64rem;
            line-height: 1.3;
        }
        .gps-status.ok { color: #86efac; }
        .gps-status.error { color: #fca5a5; }
        .col-gps { width: 28px; text-align: center; }
        .gps-indicator {
            border: 0;
            background: transparent;
            color: #60a5fa;
            padding: 3px;
            font-size: .9rem;
            cursor: pointer;
        }
        .gps-indicator:active { transform: scale(.92); }
        .gps-details {
            text-align: left;
            background: #202020;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: .76rem;
            line-height: 1.55;
        }
        .gps-details strong { color: #93c5fd; }


        /* Affichage mobile : un événement sur deux lignes, sans défilement horizontal */
        @media screen {
            .log-container {
                overflow-x: hidden;
            }
            #logTable,
            #logTable thead,
            #logTable tbody {
                display: block;
                width: 100%;
            }
            #logTable thead tr,
            #logTable tbody tr {
                display: grid;
                grid-template-columns: 68px minmax(82px, 1fr) 32px 32px;
                width: 100%;
                box-sizing: border-box;
            }
            #logTable thead tr {
                position: sticky;
                top: 0;
                z-index: 2;
                background: #161616;
                border-bottom: 1px solid #333;
            }
            #logTable thead th {
                position: static;
                width: auto;
                min-width: 0;
                padding: 7px 5px;
                border-bottom: 0;
                box-sizing: border-box;
                text-align: left;
            }
            #logTable thead th:nth-child(3),
            #logTable thead th:nth-child(4) {
                text-align: center;
            }
            #logTable thead th:nth-child(5) {
                display: none;
            }
            #logTable tbody tr {
                border-bottom: 1px solid #262626;
                padding: 0;
            }
            #logTable tbody td {
                width: auto;
                min-width: 0;
                box-sizing: border-box;
                border-bottom: 0;
                padding: 8px 5px 5px;
                align-self: center;
            }
            #logTable tbody .col-time {
                width: auto;
                white-space: nowrap;
            }
            #logTable tbody .col-type {
                width: auto;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            #logTable tbody .col-contact,
            #logTable tbody .col-gps {
                width: auto;
                text-align: center;
            }
            #logTable tbody .col-desc {
                grid-column: 1 / -1;
                width: 100%;
                padding: 4px 12px 11px;
                font-size: .91rem;
                line-height: 1.38;
                overflow-wrap: anywhere;
                word-break: normal;
            }
            #logTable tbody .plate-tag {
                max-width: 100%;
                white-space: normal;
                overflow-wrap: anywhere;
                font-size: .86rem;
                letter-spacing: .035em;
                vertical-align: baseline;
            }
        }

        .print-report-header { display: none; }
        .print-logo-wrap { display: none; }

        @media print {
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .input-zone, .action-bar, header, .type-switcher, .desc-row, #fileInput,
            .modal, th.col-gps, td.col-gps { display: none !important; }
            body {
                background: white !important;
                color: black !important;
                overflow: visible !important;
                height: auto !important;
                padding: 0 !important;
                margin: 0 !important;
                font-family: Arial, Helvetica, sans-serif !important;
            }
            .print-report-header {
                display: flex !important;
                align-items: center !important;
                justify-content: space-between !important;
                gap: 18px !important;
                border-bottom: 2px solid #000 !important;
                margin-bottom: 20px !important;
                padding: 0 0 12px 0 !important;
            }
            .print-logo-wrap {
                display: block !important;
                width: 2.55cm !important;
                height: 2.55cm !important;
                flex: 0 0 auto !important;
            }
            .print-logo-svg { width: 100% !important; height: 100% !important; }
            .gie-flame { fill: #000091 !important; }
            .gie-left-bracket { fill: #000091 !important; }
            .gie-right-bracket { fill: #e1000f !important; }
            .print-title-wrap { flex: 1; text-align: right; }
            .print-main-title {
                font-size: 15pt !important;
                font-weight: 800 !important;
                letter-spacing: .02em !important;
                color: #000 !important;
            }
            .print-subtitle {
                margin-top: 7px !important;
                font-size: 10pt !important;
                font-weight: 700 !important;
                color: #000 !important;
            }
            .log-container { overflow: visible !important; height: auto !important; background: transparent !important; margin: 0 !important; }
            table { width: 100% !important; border: 1px solid #1e293b !important; border-collapse: collapse !important; }
            th {
                background: #f1f5f9 !important;
                color: black !important;
                border-bottom: 2px solid black !important;
                padding: 8px !important;
                font-size: 9pt !important;
                text-transform: uppercase !important;
            }
            td {
                color: black !important;
                background: white !important;
                border-bottom: 1px solid #cbd5e1 !important;
                padding: 8px 6px !important;
                font-size: 9pt !important;
            }
            .t-start { color: #047857 !important; font-weight: 800 !important; }
            .t-stop { color: #be123c !important; font-weight: 800 !important; }
            .t-contact { color: #b45309 !important; font-weight: 800 !important; }
            .t-obs { color: #0369a1 !important; font-weight: 800 !important; }
            .t-dir { color: #6d28d9 !important; font-weight: 800 !important; }
            .plate-tag {
                box-shadow: none !important;
                border: 1px solid #000 !important;
                border-left: 4px solid #1d4ed8 !important;
                background: #f8fafc !important;
                color: black !important;
            }
        }
    

        /* HORUS — Rapport PDF : colonnes aérées, marges de page inchangées */
        @media print {
            table {
                width: 100% !important;
                table-layout: fixed !important;
                border-collapse: collapse !important;
            }

            /* La colonne GPS (4) reste masquée : Heure, Type, Contact, Détails. */
            thead th:nth-child(1), tbody td:nth-child(1) {
                width: 70px !important;
                min-width: 70px !important;
                max-width: 70px !important;
            }
            thead th:nth-child(2), tbody td:nth-child(2) {
                width: 90px !important;
                min-width: 90px !important;
                max-width: 90px !important;
            }
            thead th:nth-child(3), tbody td:nth-child(3) {
                width: 35px !important;
                min-width: 35px !important;
                max-width: 35px !important;
                text-align: center !important;
            }
            thead th:nth-child(5), tbody td:nth-child(5) {
                width: auto !important;
                min-width: 0 !important;
                max-width: none !important;
            }

            thead th {
                padding: 8px 10px !important;
                white-space: nowrap !important;
                vertical-align: middle !important;
            }
            tbody td {
                padding: 8px 10px !important;
                vertical-align: middle !important;
                line-height: 1.25 !important;
            }
            thead th:nth-child(1), tbody td:nth-child(1) { padding-left: 9px !important; padding-right: 11px !important; }
            thead th:nth-child(2), tbody td:nth-child(2) { padding-left: 11px !important; padding-right: 11px !important; }
            thead th:nth-child(3), tbody td:nth-child(3) { padding-left: 6px !important; padding-right: 6px !important; }
            thead th:nth-child(5), tbody td:nth-child(5) { padding-left: 12px !important; }
        }


        /* Correctifs terrain : première ligne plus lisible et en-tête réellement figé */
        @media screen {
            #logTable thead {
                position: sticky;
                top: 0;
                z-index: 20;
                display: block;
                background: #161616;
            }
            #logTable thead tr {
                position: static;
            }
            #logTable thead th {
                font-size: .72rem;
                font-weight: 800;
            }
            #logTable tbody .col-time {
                font-size: .84rem;
            }
            #logTable tbody .col-type {
                font-size: .80rem;
            }
            #logTable tbody .col-contact,
            #logTable tbody .col-gps {
                min-height: 42px;
                padding-top: 7px;
                padding-bottom: 7px;
                font-size: 1.05rem;
                cursor: pointer;
                touch-action: manipulation;
            }
            #logTable tbody .gps-indicator {
                min-width: 38px;
                min-height: 38px;
                font-size: 1.05rem;
            }
        }

        .edit-type-field {
            margin-bottom: 10px;
            text-align: left;
        }
        .edit-type-field label {
            display: block;
            margin-bottom: 5px;
            color: #cbd5e1;
            font-size: .72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .05em;
        }
        .edit-type-field select {
            width: 100%;
            padding: 11px 10px;
            border: 1px solid #555;
            border-radius: 6px;
            background: #242424;
            color: #fff;
            font-size: .95rem;
            box-sizing: border-box;
        }

</style>
</head>

    <header>
        <h1>SURVEILLANCE TACTIQUE</h1>
        <div id="clock" style="font-family: monospace; font-size: 0.75rem; color: #888;">00:00:00</div>
    </header>

    <div class="input-zone">
        <div class="operator-row">
            <div class="operator-field">
                <label for="operatorInput">Identifiant opérateur</label>
                <input type="text" id="operatorInput" placeholder="Ex. Équipe 1 / Alpha" autocomplete="off">
            </div>
            <button type="button" id="gpsButton" class="gps-btn" onclick="capturePosition()">📍 Position</button>
        </div>
        <div id="gpsStatus" class="gps-status">Aucune position associée à la prochaine entrée.</div>
        <div class="type-switcher" id="typeSwitcher">
            <div class="type-btn" data-type="START">START</div>
            <div class="type-btn" data-type="STOP">STOP</div>
            <div class="type-btn active" data-type="Observation">OBS</div>
            <div class="type-btn" data-type="Contact">CONT</div>
            <div class="type-btn" data-type="Chgt Direction">DIR</div>
        </div>
        <div class="desc-row">
            <input type="text" id="descInput" placeholder="Saisissez ou dictez..." autocomplete="off">
            <button class="btn-send" onclick="addEntry()">OK</button>
        </div>
    </div>

    <div class="log-container">
        <table id="logTable">
            <thead>
                <tr>
                    <th>Heure</th>
                    <th>Type</th>
                    <th>👥</th>
                    <th class="col-gps">📍</th>
                    <th>Détails</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="action-bar">
        <button class="btn-action b-save" onclick="exportJSON()">📤 Export</button>
        <button class="btn-action b-load" onclick="triggerFile()">📥 Import</button>
        <button class="btn-action b-pdf" onclick="printReport()">📄 PDF</button>
        <button class="btn-action b-clear" onclick="askClear()">🗑️ Reset</button>
    </div>

    <input type="file" id="fileInput" style="display:none" accept=".json" onchange="importJSON(event)">

    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0; font-size: 0.95rem;">Modifier la ligne</h3>
            <div class="edit-type-field">
                <label for="editTypeSelect">Type d’action</label>
                <select id="editTypeSelect">
                    <option value="START">START</option>
                    <option value="STOP">STOP</option>
                    <option value="Observation">OBS</option>
                    <option value="Contact">CONT</option>
                    <option value="Chgt Direction">DIR</option>
                </select>
            </div>
            <textarea id="editInput" rows="4"></textarea>
            <div class="modal-buttons" id="editActions">
                <button class="btn-modal" style="background:#555" onclick="closeEditModal()">Fermer</button>
                <button class="btn-modal" style="background:var(--danger)" id="btnDeleteLine" onclick="confirmDelete()">Supprimer</button>
                <button class="btn-modal" style="background:var(--primary)" onclick="saveCurrentLine()">Valider</button>
            </div>
            <div class="modal-buttons" id="deleteConfirm" style="display:none; flex-direction: column;">
                <p style="margin:0 0 10px 0; color:var(--danger); font-weight:bold;">Confirmer la suppression ?</p>
                <div style="display:flex; gap:8px; width:100%;">
                    <button class="btn-modal" style="background:#555" onclick="cancelDelete()">Annuler</button>
                    <button class="btn-modal" style="background:var(--danger)" onclick="executeDelete()">OUI, Supprimer</button>
                </div>
            </div>
        </div>
    </div>

    <div id="gpsModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0; font-size: 1rem;">Point de géolocalisation</h3>
            <div id="gpsModalDetails" class="gps-details"></div>
            <div class="modal-buttons">
                <button class="btn-modal" style="background:#2563eb" onclick="openCurrentGpsMap('google')">Google Maps</button>
                <button class="btn-modal" style="background:#047857" onclick="openCurrentGpsMap('osm')">OpenStreetMap</button>
            </div>
            <div class="modal-buttons">
                <button class="btn-modal" style="background:#555" onclick="closeGpsModal()">Fermer</button>
                <button class="btn-modal" style="background:var(--danger)" onclick="removeGpsFromCurrentRow()">Retirer le point</button>
            </div>
        </div>
    </div>

    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0; font-size: 1rem;">Effacer tout ?</h3>
            <p style="font-size: 0.85rem;">Cette action est irréversible.</p>
            <div class="modal-buttons">
                <button class="btn-modal" style="background:#555" onclick="closeModal()">Annuler</button>
                <button class="btn-modal" style="background:var(--danger)" onclick="doClear()">Effacer</button>
            </div>
        </div>
    </div>

    <script>
        const tableBody = document.querySelector('#logTable tbody');
        const descInput = document.getElementById('descInput');
        const typeBtns = document.querySelectorAll('.type-btn');
        const operatorInput = document.getElementById('operatorInput');
        const gpsButton = document.getElementById('gpsButton');
        const gpsStatus = document.getElementById('gpsStatus');
        let currentType = 'Observation';
        let currentRowToEdit = null;
        let currentGpsRow = null;
        let pendingGeolocation = null;
        // Date effective de la surveillance, indépendante de la date d'impression.
        let sessionDateISO = new Date().toISOString().slice(0, 10);

        function isoToFrenchDate(isoDate) {
            const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(isoDate || '');
            return match ? `${match[3]}/${match[2]}/${match[1]}` : new Date().toLocaleDateString('fr-FR');
        }

        function extractSessionDate(data) {
            if (data && /^\d{4}-\d{2}-\d{2}$/.test(data.dateRaw || '')) return data.dateRaw;
            if (data && /^\d{4}-\d{2}-\d{2}$/.test(data.sessionDateISO || '')) return data.sessionDateISO;
            const direct = data && typeof data.date === 'string' ? data.date.match(/(\d{2})\/(\d{2})\/(\d{4})/) : null;
            if (direct) return `${direct[3]}-${direct[2]}-${direct[1]}`;
            const legacy = data && typeof data.dateMission === 'string' ? data.dateMission.match(/(\d{2})\/(\d{2})\/(\d{4})/) : null;
            if (legacy) return `${legacy[3]}-${legacy[2]}-${legacy[1]}`;
            return null;
        }


        function normalizeOperator(value) {
            return (value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .toUpperCase().replace(/[^A-Z0-9]+/g, '').trim();
        }

        function saveOperatorPreference() {
            try { localStorage.setItem('horusOperatorLabel', operatorInput.value.trim()); } catch (_) {}
        }

        function restoreOperatorPreference() {
            try { operatorInput.value = localStorage.getItem('horusOperatorLabel') || ''; } catch (_) {}
        }

        function resetPendingGps(message = 'Aucune position associée à la prochaine entrée.') {
            pendingGeolocation = null;
            gpsButton.classList.remove('loading', 'ready');
            gpsButton.textContent = '📍 Position';
            gpsStatus.className = 'gps-status';
            gpsStatus.textContent = message;
        }

        function capturePosition() {
            if (!navigator.geolocation) {
                gpsStatus.className = 'gps-status error';
                gpsStatus.textContent = 'La géolocalisation n’est pas disponible sur ce navigateur.';
                return;
            }
            gpsButton.classList.remove('ready');
            gpsButton.classList.add('loading');
            gpsButton.textContent = '⌛ GPS…';
            gpsStatus.className = 'gps-status';
            gpsStatus.textContent = 'Recherche de la position actuelle…';

            navigator.geolocation.getCurrentPosition(
                position => {
                    const c = position.coords;
                    pendingGeolocation = {
                        latitude: Number(c.latitude),
                        longitude: Number(c.longitude),
                        accuracy: Number.isFinite(c.accuracy) ? Number(c.accuracy) : null,
                        altitude: Number.isFinite(c.altitude) ? Number(c.altitude) : null,
                        altitudeAccuracy: Number.isFinite(c.altitudeAccuracy) ? Number(c.altitudeAccuracy) : null,
                        heading: Number.isFinite(c.heading) ? Number(c.heading) : null,
                        speed: Number.isFinite(c.speed) ? Number(c.speed) : null,
                        capturedAt: new Date(position.timestamp || Date.now()).toISOString(),
                        source: 'operator-device'
                    };
                    gpsButton.classList.remove('loading');
                    gpsButton.classList.add('ready');
                    gpsButton.textContent = '✓ GPS prêt';
                    gpsStatus.className = 'gps-status ok';
                    const precision = pendingGeolocation.accuracy !== null ? ` — précision ± ${Math.round(pendingGeolocation.accuracy)} m` : '';
                    gpsStatus.textContent = `${pendingGeolocation.latitude.toFixed(6)}, ${pendingGeolocation.longitude.toFixed(6)}${precision}`;
                },
                error => {
                    const messages = {
                        1: 'Autorisation de géolocalisation refusée.',
                        2: 'Position indisponible. Vérifiez le GPS du téléphone.',
                        3: 'Délai dépassé lors de la recherche GPS.'
                    };
                    resetPendingGps();
                    gpsStatus.className = 'gps-status error';
                    gpsStatus.textContent = messages[error.code] || 'Impossible d’obtenir la position.';
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        function gpsButtonHtml(gps) {
            return gps ? '<button type="button" class="gps-indicator" title="Voir le point GPS" aria-label="Voir le point GPS">📍</button>' : '';
        }

        function openGpsModal(row) {
            if (!row || !row._geolocation) return;
            currentGpsRow = row;
            const g = row._geolocation;
            const lines = [
                `<strong>Latitude :</strong> ${Number(g.latitude).toFixed(7)}`,
                `<strong>Longitude :</strong> ${Number(g.longitude).toFixed(7)}`,
                `<strong>Précision :</strong> ${g.accuracy == null ? 'non fournie' : '± ' + Math.round(g.accuracy) + ' m'}`,
                `<strong>Horodatage :</strong> ${g.capturedAt ? new Date(g.capturedAt).toLocaleString('fr-FR') : 'non fourni'}`
            ];
            if (g.altitude != null) lines.push(`<strong>Altitude :</strong> ${Number(g.altitude).toFixed(1)} m`);
            if (g.speed != null) lines.push(`<strong>Vitesse :</strong> ${(Number(g.speed) * 3.6).toFixed(1)} km/h`);
            if (g.heading != null) lines.push(`<strong>Cap :</strong> ${Math.round(Number(g.heading))}°`);
            document.getElementById('gpsModalDetails').innerHTML = lines.join('<br>');
            document.getElementById('gpsModal').style.display = 'flex';
        }

        function closeGpsModal() {
            document.getElementById('gpsModal').style.display = 'none';
            currentGpsRow = null;
        }

        function openCurrentGpsMap(service) {
            if (!currentGpsRow || !currentGpsRow._geolocation) return;
            const g = currentGpsRow._geolocation;
            const latitude = Number(g.latitude);
            const longitude = Number(g.longitude);
            if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) return;

            const serviceName = service === 'osm' ? 'OpenStreetMap' : 'Google Maps';
            const accepted = window.confirm(
                `Cette action va transmettre les seules coordonnées sélectionnées à ${serviceName}. Continuer ?`
            );
            if (!accepted) return;

            const url = service === 'osm'
                ? `https://www.openstreetmap.org/?mlat=${encodeURIComponent(latitude)}&mlon=${encodeURIComponent(longitude)}#map=18/${encodeURIComponent(latitude)}/${encodeURIComponent(longitude)}`
                : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(latitude + ',' + longitude)}`;
            window.open(url, '_blank', 'noopener,noreferrer');
        }

        function removeGpsFromCurrentRow() {
            if (!currentGpsRow) return;
            currentGpsRow._geolocation = null;
            const cell = currentGpsRow.querySelector('.col-gps');
            if (cell) cell.innerHTML = '';
            closeGpsModal();
        }

        const phonetics = {
            'ALPHA': 'A', 'ALFA': 'A', 'BRAVO': 'B', 'CHARLIE': 'C', 'CHARLY': 'C', 'DELTA': 'D', 'ECHO': 'E', 'ÉCHO': 'E',
            'FOXTROT': 'F', 'FOX-TROT': 'F', 'GOLF': 'G', 'HOTEL': 'H', 'HÔTEL': 'H', 'INDIA': 'I', 'JULIETT': 'J', 'JULIET': 'J', 'JULIETTE': 'J',
            'KILO': 'K', 'KILOS': 'K', 'LIMA': 'L', 'MIKE': 'M', 'NOVEMBER': 'N', 'OSCAR': 'O', 'PAPA': 'P', 'QUEBEC': 'Q',
            'ROMEO': 'R', 'ROMÉO': 'R', 'ROME': 'R', 'SIERRA': 'S', 'SIRRA': 'S', 'TANGO': 'T', 'UNIFORM': 'U', 'UNIFORME': 'U', 'VICTOR': 'V', 'VICTORE': 'V', 'WHISKEY': 'W',
            'X-RAY': 'X', 'XR': 'X', 'XRAY': 'X', 'YANKEE': 'Y', 'YANKEES': 'Y', 'YANKIE': 'Y', 'YANKI': 'Y', 'ZULU': 'Z', 'ZOULOU': 'Z'
        };

        function applyPlateStyle(rawText) {
            let clean = rawText.toUpperCase().replace(/[^A-Z0-9]/g, '');
            if (clean.length === 7 && /^[A-Z]{2}[0-9]{3}[A-Z]{2}$/.test(clean)) {
                return `<span class="plate-tag">${clean.slice(0,2)}-${clean.slice(2,5)}-${clean.slice(5,7)}</span>`;
            }
            if (/^[0-9]+[A-Z]+[0-9]+$/.test(clean)) {
                return `<span class="plate-tag">${clean.replace(/([0-9]+)([A-Z]+)([0-9]+)/, '$1 $2 $3')}</span>`;
            }
            return `<span class="plate-tag">${clean}</span>`;
        }

        function normalizeToken(token) {
            return String(token || '')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toUpperCase()
                .replace(/^[^A-Z0-9]+|[^A-Z0-9-]+$/g, '');
        }

        function formatPlatePlain(compact) {
            const clean = String(compact || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
            if (/^[A-Z]{2}[0-9]{3}[A-Z]{2}$/.test(clean)) {
                return `${clean.slice(0, 2)}-${clean.slice(2, 5)}-${clean.slice(5, 7)}`;
            }
            if (/^[0-9]+[A-Z]+[0-9]+$/.test(clean)) {
                // En interne, une plaque FNI issue de la commande vocale reste compacte.
                // Le visuel « plaque » réintroduit ensuite les espaces à l'affichage.
                return clean;
            }
            return clean;
        }

        /*
         * Le mot-clé « IMMATRICULATION : » déclenche uniquement la conversion
         * des éléments phonétiques qui suivent. Le parseur s'arrête dès que la
         * plaque SIV est complète ou au premier mot qui n'appartient pas à la plaque.
         * Le reste de la phrase est conservé sans modification.
         */
        function parseImmatriculationCommand(rawContent) {
            const source = String(rawContent || '');
            const trigger = /IMMATRICULATION\s*:\s*/i;
            const match = trigger.exec(source);
            if (!match) return source;

            const prefix = source.slice(0, match.index).trimEnd();
            const tail = source.slice(match.index + match[0].length);
            const tokens = Array.from(tail.matchAll(/\S+/g));
            const contributions = [];
            let consumed = 0;
            let compact = '';
            let completeAt = -1;

            for (let i = 0; i < tokens.length; i += 1) {
                const originalToken = tokens[i][0];
                const normalizedToken = normalizeToken(originalToken);
                let contribution = '';

                if (Object.prototype.hasOwnProperty.call(phonetics, normalizedToken)) {
                    contribution = phonetics[normalizedToken];
                } else if (/^[0-9]+$/.test(normalizedToken)) {
                    contribution = normalizedToken;
                } else if (/^[A-Z]{1,3}-?[0-9]{1,4}-?[A-Z0-9]{0,3}$/.test(normalizedToken) && /[0-9]/.test(normalizedToken)) {
                    contribution = normalizedToken.replace(/-/g, '');
                } else {
                    break;
                }

                contributions.push(contribution);
                compact += contribution;
                consumed = i + 1;

                // Format SIV : AA-123-AA
                if (/^[A-Z]{2}[0-9]{3}[A-Z]{2}$/.test(compact)) {
                    completeAt = consumed;
                    break;
                }

                // Format FNI courant : 1 à 4 chiffres + 1 à 3 lettres + département 2/3 chiffres,
                // avec également les départements corses 2A / 2B.
                if (/^[0-9]{1,4}[A-Z]{1,3}(?:[0-9]{2,3}|2[AB])$/.test(compact)) {
                    completeAt = consumed;
                    break;
                }
            }

            if (!compact || consumed === 0) {
                return [prefix, tail.trimStart()].filter(Boolean).join(' ').trim();
            }

            // Si aucun format complet n'est détecté, on conserve seulement les jetons radio/chiffres
            // effectivement reconnus, sans absorber le reste de la phrase.
            const used = completeAt > 0 ? completeAt : consumed;
            const compactPlate = contributions.slice(0, used).join('');
            const plate = formatPlatePlain(compactPlate);
            const remainderStart = used < tokens.length ? tokens[used].index : tail.length;
            const remainder = tail.slice(remainderStart).trimStart();
            return [prefix, plate, remainder].filter(Boolean).join(' ').replace(/\s+/g, ' ').trim();
        }

        // Conversion destinée à l'export et à la sauvegarde du texte nettoyé.
        function cleanPhoneticForExport(rawContent) {
            return parseImmatriculationCommand(rawContent)
                .replace(/->/g, '→')
                .replace(/<-/g, '←');
        }

        function processPhonetic(rawContent) {
            let text = rawContent.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().trim();
            Object.keys(phonetics).forEach(word => {
                const regex = new RegExp('(^|\\s|[^A-Z0-9])' + word + '($|\\s|[^A-Z0-9])', 'g');
                text = text.replace(regex, '$1' + phonetics[word] + '$2');
            });
            return applyPlateStyle(text);
        }

        function formatDisplay(text) {
            if (!text) return "";
            const cleanedText = parseImmatriculationCommand(text);
            const words = cleanedText.split(/(\s+)/);
            const formattedWords = words.map(word => {
                const testWord = word.toUpperCase().replace(/-/g, '').trim();
                const isSiv = /^[A-Z]{2}[0-9]{3}[A-Z]{2}$/.test(testWord);
                const isFni = /^[0-9]+[A-Z]+[0-9]+$/.test(testWord);
                if (isSiv || isFni) return applyPlateStyle(word);
                return word;
            });
            return formattedWords.join("").replace(/->/g, "→").replace(/<-/g, "←");
        }

        const dictatedTypePrefixes = [
            { pattern: /^(?:START|DÉPART|DEPART)\b\s*[:;,.\-]?\s*/i, type: 'START' },
            { pattern: /^(?:STOP|ARRÊT|ARRET)\b\s*[:;,.\-]?\s*/i, type: 'STOP' },
            { pattern: /^(?:OBS|OBSERVATION)\b\s*[:;,.\-]?\s*/i, type: 'Observation' },
            { pattern: /^(?:CONT|CONTACT)\b\s*[:;,.\-]?\s*/i, type: 'Contact' },
            { pattern: /^(?:DIR|DIRECTION|CHGT\s+DIRECTION|CHANGEMENT\s+DE\s+DIRECTION)\b\s*[:;,.\-]?\s*/i, type: 'Chgt Direction' }
        ];

        function parseDictatedType(text) {
            const source = String(text || '').trimStart();
            for (const item of dictatedTypePrefixes) {
                const match = source.match(item.pattern);
                if (match) {
                    return { type: item.type, text: source.slice(match[0].length).trimStart() };
                }
            }
            return { type: null, text: String(text || '').trim() };
        }

        function selectType(type) {
            currentType = type;
            typeBtns.forEach(button => button.classList.toggle('active', button.dataset.type === type));
        }

        function previewDictatedType() {
            const parsed = parseDictatedType(descInput.value);
            if (parsed.type) selectType(parsed.type);
        }

        function addEntry(data = null) {
            const parsed = data ? null : parseDictatedType(descInput.value);
            const val = parseImmatriculationCommand(data ? data.desc : parsed.text);
            if (!val && !data) return;
            if (!data && parsed.type) selectType(parsed.type);
            const row = document.createElement('tr');
            row.dataset.rawDesc = val;
            const time = data ? data.heure : new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
            const type = data ? data.type : currentType;
            const contact = data ? data.contact : (currentType === 'Contact' ? '👥' : '');
            const gps = data ? (data.geolocation || data.gps || null) : pendingGeolocation;
            row._geolocation = gps ? JSON.parse(JSON.stringify(gps)) : null;
            let tClass = 't-obs';
            if(type === 'START') tClass = 't-start';
            if(type === 'STOP') tClass = 't-stop';
            if(type === 'Contact') tClass = 't-contact';
            if(type === 'Chgt Direction') tClass = 't-dir';
            row.innerHTML = `
                <td class="col-time">${time}</td>
                <td class="col-type ${tClass}">${type}</td>
                <td class="col-contact" onclick="toggleContact(event, this)">${contact}</td>
                <td class="col-gps">${gpsButtonHtml(row._geolocation)}</td>
                <td class="col-desc" onclick="openEditModal(this.parentElement)">${formatDisplay(val)}</td>
            `;
            const gpsControl = row.querySelector('.gps-indicator');
            if (gpsControl) gpsControl.addEventListener('click', event => { event.stopPropagation(); openGpsModal(row); });
            tableBody.prepend(row);
            if(!data) {
                descInput.value = '';
                resetPendingGps('Point GPS enregistré avec la ligne. Appuyez sur « Position » pour le prochain point.');
                descInput.focus();
            }
        }

        function toggleContact(e, cell) {
            e.stopPropagation();
            cell.innerHTML = cell.innerHTML === '' ? '👥' : '';
        }

        function openEditModal(row) {
            currentRowToEdit = row;
            document.getElementById('editInput').value = row.dataset.rawDesc;
            document.getElementById('editTypeSelect').value = row.cells[1].innerText.trim();
            document.getElementById('editActions').style.display = 'flex';
            document.getElementById('deleteConfirm').style.display = 'none';
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeEditModal() { document.getElementById('editModal').style.display = 'none'; }

        function typeClassFor(type) {
            if (type === 'START') return 't-start';
            if (type === 'STOP') return 't-stop';
            if (type === 'Contact') return 't-contact';
            if (type === 'Chgt Direction') return 't-dir';
            return 't-obs';
        }

        function saveCurrentLine() {
            if(currentRowToEdit) {
                const newText = parseImmatriculationCommand(document.getElementById('editInput').value);
                const newType = document.getElementById('editTypeSelect').value;
                currentRowToEdit.dataset.rawDesc = newText;
                currentRowToEdit.querySelector('.col-desc').innerHTML = formatDisplay(newText);
                const typeCell = currentRowToEdit.querySelector('.col-type');
                typeCell.className = `col-type ${typeClassFor(newType)}`;
                typeCell.textContent = newType;
                // Comme lors de la création, le passage au type Contact valide automatiquement l'icône.
                if (newType === 'Contact' && !currentRowToEdit.querySelector('.col-contact').textContent.trim()) {
                    currentRowToEdit.querySelector('.col-contact').textContent = '👥';
                }
                closeEditModal();
            }
        }

        function confirmDelete() {
            document.getElementById('editActions').style.display = 'none';
            document.getElementById('deleteConfirm').style.display = 'flex';
        }

        function cancelDelete() {
            document.getElementById('deleteConfirm').style.display = 'none';
            document.getElementById('editActions').style.display = 'flex';
        }

        function executeDelete() {
            if(currentRowToEdit) {
                currentRowToEdit.remove();
                closeEditModal();
            }
        }

        function triggerFile() { document.getElementById('fileInput').click(); }

        function exportJSON() {
            const rows = Array.from(document.querySelectorAll("tbody tr")).reverse().map(tr => {
                // Pour l'export, on convertit la description "radio" en description "texte clair"
                // Cela permet à la version bureau de lire correctement les données sans modification
                const cleanDesc = cleanPhoneticForExport(tr.dataset.rawDesc);
                
                return {
                    heure: tr.cells[0].innerText,
                    type: tr.cells[1].innerText,
                    contact: tr.cells[2].innerHTML,
                    desc: cleanDesc,
                    geolocation: tr._geolocation ? JSON.parse(JSON.stringify(tr._geolocation)) : null
                };
            });
            const surveillanceDate = isoToFrenchDate(sessionDateISO);
            const operatorLabel = operatorInput.value.trim();
            saveOperatorPreference();
            const sessionData = {
                schemaVersion: 2,
                application: 'HORUS - Surveillance Tactique Mobile',
                operator: {
                    label: operatorLabel,
                    key: normalizeOperator(operatorLabel)
                },
                dateRaw: sessionDateISO,
                date: surveillanceDate,
                dateMission: `JOURNAL DE SURVEILLANCE DU ${surveillanceDate}`,
                logs: rows
            };
            const blob = new Blob([JSON.stringify(sessionData, null, 2)], {type: "application/json"});
            const dateStr = surveillanceDate.replace(/\//g, '-');

            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `Surveillance_Tactique_${dateStr}.json`;
            a.click();
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    const logs = data.logs || data;
                    const importedDate = Array.isArray(data) ? null : extractSessionDate(data);
                    // Pour les anciens fichiers sans métadonnée, la date du fichier est utilisée
                    // si elle est disponible ; sinon la date courante reste la valeur de repli.
                    if (!Array.isArray(data) && data.operator) {
                        operatorInput.value = typeof data.operator === 'string' ? data.operator : (data.operator.label || '');
                        saveOperatorPreference();
                    }
                    if (importedDate) {
                        sessionDateISO = importedDate;
                    } else if (file.lastModified) {
                        const fileDate = new Date(file.lastModified);
                        sessionDateISO = `${fileDate.getFullYear()}-${String(fileDate.getMonth()+1).padStart(2,'0')}-${String(fileDate.getDate()).padStart(2,'0')}`;
                    }
                    tableBody.innerHTML = "";
                    logs.forEach(l => addEntry(l));
                } catch(err) { alert("Format invalide"); }
            };
            reader.readAsText(file);
        }

        function askClear() { document.getElementById('confirmModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('confirmModal').style.display = 'none'; }
        function doClear() { tableBody.innerHTML = ""; sessionDateISO = new Date().toISOString().slice(0, 10); resetPendingGps(); closeModal(); }

        descInput.addEventListener('input', previewDictatedType);

        typeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                typeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentType = btn.getAttribute('data-type');
            });
        });

        descInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') addEntry(); });
        operatorInput.addEventListener('change', saveOperatorPreference);
        operatorInput.addEventListener('blur', saveOperatorPreference);
        restoreOperatorPreference();


        let printOrderReversed = false;
        function printReport() {
            // Préparation explicite utile sur Safari/Brave mobile, où beforeprint peut être tardif.
            prepareMobilePrint();
            requestAnimationFrame(() => {
                setTimeout(() => window.print(), 40);
            });
        }
        function prepareMobilePrint() {
            const printDate = document.getElementById('printDate');
            if (printDate) printDate.textContent = isoToFrenchDate(sessionDateISO);
            if (!printOrderReversed) {
                Array.from(tableBody.children).reverse().forEach(row => tableBody.appendChild(row));
                printOrderReversed = true;
            }
        }
        function restoreMobileScreenOrder() {
            if (!printOrderReversed) return;
            Array.from(tableBody.children).reverse().forEach(row => tableBody.appendChild(row));
            printOrderReversed = false;
        }
        window.addEventListener('beforeprint', prepareMobilePrint);
        window.addEventListener('afterprint', restoreMobileScreenOrder);

        setInterval(() => {
            const clockEl = document.getElementById('clock');
            if (clockEl) clockEl.innerText = new Date().toLocaleTimeString('fr-FR');
        }, 1000);
    </script>
</body>
</html>
